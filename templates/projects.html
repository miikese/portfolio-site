<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — {{.Name}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="/" class="brand">{{.Name}}.</a>
      <div class="topnav-links">
        <a href="/#profile">← back home</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section class="block">
      <h2 class="page-title">All Projects</h2>
      <p class="bio">{{len .Projects}} projects, built in Go from the standard library up.</p>

      <div class="list projects-index">
        {{range .Projects}}
        <a class="project-card" href="/projects/{{.Slug}}">
          <p class="signature"><span class="kw">func</span> <span class="fname">{{.FuncName}}</span>(<span class="params">{{.Params}}</span>) <span class="ret">{{.Returns}}</span></p>
          <p class="blurb">{{.Blurb}}</p>
          <ul class="bullets">
            {{range .Bullets}}<li>{{.}}</li>{{end}}
          </ul>
          <div class="tags">
            {{range .Stack}}<span class="tag">{{.}}</span>{{end}}
          </div>
        </a>
        {{end}}
      </div>
    </section>

    <footer class="footer">
      <a href="/#top">← back to home</a>
    </footer>
  </main>
</body>
</html>
